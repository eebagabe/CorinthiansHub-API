spring.application.name=backend
# Segredos ficam no .env (fora do git); variaveis de ambiente do sistema tem prioridade
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db_corinthians_hub}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Assina os tokens do admin (HS256). Minimo 32 caracteres; gere com: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
# Origens do frontend autorizadas a chamar a API (separadas por virgula)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
