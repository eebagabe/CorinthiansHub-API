name: corinthians-hub

services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: db_corinthians_hub
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # S3 local para testar upload de fotos (em producao e o Cloudflare R2); nao confere credenciais
  s3:
    image: 'adobe/s3mock:4.7.0'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${R2_BUCKET:?defina R2_BUCKET no .env}
    ports:
      - '127.0.0.1:9090:9090'

volumes:
  pgdata:
